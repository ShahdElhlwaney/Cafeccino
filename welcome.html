<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="dist/css/main.css">
    <title>Cafeccino</title>
</head>
<body>
    <div class="container">
        <header>
            <div class="header">
                <div class="humburger">
                </div>
                <div class="website">
                    <img src="img/logo.svg" alt="" class="website-logo">
                   <h2 class="website-title">
                    Cafe<span>cceno</span>
                   </h2>
                </div>
                <nav class="nav">
                    <ul class="nav-list">
                        <li class="nav-list__item active" >
                            <a href="#!">Home</a>
                        </li>
                        <li class="nav-list__item">
                            <a href="#!">Our Product</a>
                        </li>
                        <li class="nav-list__item">
                            <a href="#!">Delivery</a>
                        </li>
                    </ul>
                </nav>
                <div class="signup-btn">
                    sign up
                </div>
                <div class="search-input">
                    <img  src="img/search.svg" alt="image not found" class="search-icon">
                    <input type="text">
                </div>
                <div class="lang">
                    <img src="img/lang.svg" alt="" class="lang-icon">
                    <h2 class="lang-text">English</h2>
                </div>
                <img class="cart-header" src="img/cart-header.svg">
            </div>
            <div class="header-cover">
                <div class="header-cover__content">
                    <h1>Enjoy your <span>coffee</span> 
                        <br> before your activity
                    </h1>
                    <p>
                        Boost your productivity and 
                        build your <br> mood with a glass of coffee in the morning 
                    </p>
                    <div class="header-cover--btns">
                        <button class="order-now_btn">
                           <p>order now</p>

                            
                            <div class="cart-icon-container">
                                <img src="img/cart.svg" class="cart-icon">
                            </div>
                        </button>
                        <div class="more-menu_btn">
                            More menu
                        </div>
                    </div>
                </div>
                <div class="header-cover--component">
                    <div class="header-cover--component__cappuccino">
                        cappuccino
                    </div>
                    <img src="/img/cappuccino.png" alt="image not found">
                    <div class="header-cover--component__rate">
                       <span><b>4.8</b></span>
                       
                        <img src="/img/star.svg">
                    </div>
                </div>
              </div>
        </header>
    
          
    </div>
    
</body>
</html>
