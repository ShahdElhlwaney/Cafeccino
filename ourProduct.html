<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="dist/css/main.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

    <script type="module" src="js/productsController.js"></script>
    <title>Cafeccino</title></head>
<body>
    <div class="container">
        <header>
            <div class="header">
                <div class="humburger">
                </div>
                <div class="website">
                    <img src="img/logo.svg" alt="" class="website-logo">
                   <h2 class="website-title">
                    Cafe<span>cceno</span>
                   </h2>
                </div>
                <nav class="nav">
                    <ul class="nav-list">
                        <li class="nav-list__item " >
                            <a href="#!">Home</a>
                        </li>
                        <li class="nav-list__item active">
                            <a href="ourProduct.html">Our Product</a>
                        </li>
                        <li class="nav-list__item">
                            <a href="#!">Delivery</a>
                        </li>
                    </ul>
                </nav>
                <div class="userName">
                </div>
                <div class="our-product__search-input">
                    <img  src="img/search.svg" alt="image not found" class="search-icon">
                    <input type="text">
                </div>
                <div class="lang">
                    <img src="img/lang.svg" alt="" class="lang-icon">
                    <h2 class="lang-text">English</h2>
                    <i class='fas fa-angle-down' style='font-size:2rem'></i>

                </div>
                <img class="cart-header" src="img/cart-header.svg">
            </div>
            
        </header>
        <div class="our-product">
          <div class="our-product__content">
            <h1>Welcome to <span>Cafeccino</span> </h1>
            <p>Where Every Sip Inspires, and Every Bite Tells a Story!</p>
            <div class="our-product__content--btns">
                <button class="order-now_btn"><a href="products.html">Order Now</a></button>
                <button class="offers_btn">Offers</button>
            </div>
           
          </div>
          <div class="our-product__img">
              <img src="img/our-product.svg" alt="">
          </div>
        </div>
    </div>        
</body>
</html>
